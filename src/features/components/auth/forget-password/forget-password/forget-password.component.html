<mat-card>
    <h2>Forgot Password</h2>
    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="fill" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput placeholder="Enter your email" formControlName="email" type="email">
            <mat-error *ngIf="resetForm.controls?.['email']?.invalid">Valid email is required</mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="resetForm.invalid">
            Submit
        </button>
    </form>

    <div class="message success" *ngIf="message">{{ message }}</div>
    <div class="message error" *ngIf="error">{{ error }}</div>

    <div class="back-link">
        <a routerLink="/login">Back to Login</a>
    </div>
</mat-card>
